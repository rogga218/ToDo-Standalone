name: Bug report
description: Create a report to help us fix a problem or bug
title: "[BUG]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: environment
    attributes:
      label: Deployment / Execution Mode
      description: How are you running the ToDo Application?
      options:
        - "Container (Podman / Docker)"
        - "Standalone Desktop Executable (.exe)"
        - "Local Python Dev (python -m src.main)"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running the host on?
      options:
        - "Windows"
        - "Linux"
        - "macOS"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version / Commit
      description: What version or git commit of the app are you using? (e.g. v2.0.0 or main)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include error messages or crash.log output if available)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start the app via '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (e.g. screenshots, browser name, logs).
    validations:
      required: false
