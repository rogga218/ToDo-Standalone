name: Feature request
description: Suggest an idea or new feature for this project
title: "[FEATURE]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!
  - type: dropdown
    id: category
    attributes:
      label: Feature Component / Area
      description: Which area of the application does this feature request relate to?
      options:
        - "Frontend / UI (NiceGUI)"
        - "Backend / API (FastAPI / SQLModel)"
        - "AI Subtask Assistant (Gemini)"
        - "Desktop Packaging (PySide6 / PyInstaller)"
        - "Containerization (Docker / Podman)"
        - "General / Documentation"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is or what use case is missing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or workarounds considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, design sketches, or screenshots about the feature request here.
    validations:
      required: false
